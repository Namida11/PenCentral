<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PenCentral</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">PC</div>
      <div>
        <h1>PenCentral</h1>
        <p>İcazəli recon paneli</p>
      </div>
    </div>

    <form id="scan-form" class="card form">
      <label>Target
        <input name="target" placeholder="icazeli-target.com" required />
      </label>

      <div class="mods">
        <label class="chk"><input type="checkbox" name="stage" value="subs" checked /> Subdomain</label>
        <label class="chk"><input type="checkbox" name="stage" value="probe" checked /> Live / httpx</label>
        <label class="chk"><input type="checkbox" name="stage" value="ports" checked /> Port scan</label>
        <label class="chk"><input type="checkbox" name="stage" value="dirs" /> Directory enum</label>
        <label class="chk"><input type="checkbox" name="stage" value="source" checked /> Source analiz</label>
        <label class="chk"><input type="checkbox" name="stage" value="nuclei" checked /> Nuclei</label>
      </div>

      <label>Wordlist (dir enum)
        <input name="wordlist" placeholder="/usr/share/seclists/.../common.txt" />
      </label>

      <label class="chk auth">
        <input type="checkbox" name="authorized" required />
        Bu target üçün yazılı icazəm var
      </label>

      <button type="submit" id="start-btn">Scan başlat</button>
      <button type="button" id="demo-btn" class="ghost">UI demo tapıntı yüklə</button>
    </form>

    <div class="tools card" id="tools"></div>

    <div class="history">
      <h2>Scan-lər</h2>
      <div id="scan-list"></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h2 id="scan-title">Scan seç</h2>
        <p id="scan-meta" class="muted">Soldan yeni scan başlat və ya mövcuduna kliklə.</p>
      </div>
      <div class="top-actions">
        <button type="button" id="adapt-btn" class="ghost slim">Köhnə scanı uyğunlaşdır</button>
        <button type="button" id="delete-btn" class="ghost slim danger">Scanı sil</button>
        <div class="pills" id="progress-pills"></div>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <nav class="tabs" id="tabs">
      <button data-cat="" class="on">Hamısı</button>
      <button data-cat="subs">Subdomain</button>
      <button data-cat="probe">Live</button>
      <button data-cat="ports">Port</button>
      <button data-cat="dirs">Directory</button>
      <button data-cat="endpoints">Endpointlər</button>
      <button data-cat="source">Source</button>
      <button data-cat="nuclei">Nuclei</button>
    </nav>

    <div class="toolbar">
      <input id="filter" placeholder="Axtar..." />
      <select id="status-filter">
        <option value="">Status: hamısı</option>
        <option value="active" selected>Aktiv (status var)</option>
        <option value="200">200</option>
        <option value="301">301</option>
        <option value="302">302</option>
        <option value="401">401</option>
        <option value="403">403</option>
        <option value="404">404</option>
        <option value="500">500</option>
        <option value="502">502</option>
        <option value="503">503</option>
        <option value="empty">status yox</option>
      </select>
      <label class="chk"><input type="checkbox" id="only-open" /> Yalnız Done olmayan</label>
      <a class="dl" id="dl-txt" href="#" download>Siyahını yüklə (.txt)</a>
      <a class="dl" id="dl-csv" href="#" download>CSV</a>
      <span class="muted" id="count-label"></span>
    </div>

    <section class="ep-wrap">
      <h3>Endpointlər</h3>
      <p class="muted">Tapdığın URL-i əlavə et — ayrıca siyahıda saxlanır.</p>
      <div class="note-add">
        <input id="ep-url" placeholder="https://api.target.com/v1/users" />
        <input id="ep-note" placeholder="qeyd (istəyə bağlı)" />
        <button type="button" id="ep-add" class="ghost slim">Əlavə et</button>
      </div>
    </section>

    <div id="findings" class="list"></div>

    <section class="notes-wrap">
      <div class="notes-head">
        <h3>Qeydlər</h3>
        <button type="button" id="copy-notes" class="ghost">Cədvəli kopyala</button>
      </div>
      <p class="muted" id="notes-empty">Subdomain kartında qeyd yaz — burada cədvəl yaranacaq.</p>
      <div class="table-scroll">
        <table id="notes-table">
          <thead>
            <tr><th>Host</th><th>URL</th><th>Qeyd</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="log-wrap">
      <h3>Log</h3>
      <pre id="logs"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
